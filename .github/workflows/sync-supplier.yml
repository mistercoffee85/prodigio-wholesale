name: Nightly Supplier Sync (Migroweb)

on:
  schedule:
    # Every night at 02:00 CET (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions tab
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  sync:
    name: Sync Migroweb Products
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Puppeteer browsers
        run: npx puppeteer browsers install chrome

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL:   ${{ secrets.DIRECT_URL }}

      - name: Run supplier sync
        run: node scripts/sync/migroweb-scraper.js
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          DIRECT_URL:      ${{ secrets.DIRECT_URL }}
          MIGROWEB_URL:    ${{ secrets.MIGROWEB_URL }}
          MIGROWEB_USER:   ${{ secrets.MIGROWEB_USER }}
          MIGROWEB_PASS:   ${{ secrets.MIGROWEB_PASS }}
          MARKUP_FACTOR:   ${{ secrets.MARKUP_FACTOR }}
          SYNC_DRY_RUN:    ${{ github.event.inputs.dry_run || 'false' }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Migroweb sync failed! Check logs above."
          # Optional: add Slack/email notification here
